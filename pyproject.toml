[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relationl"
version = "0.1.0"
description = "Recover table-level join lineage from SQL, PySpark, notebooks and text across a codebase."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hugo McDermott", email = "mcdermott.h01@gmail.com" }]
keywords = ["lineage", "sql", "pyspark", "joins", "static-analysis", "data-catalog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "sqlglot>=25.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
relationl = "relationl.cli:main"

[project.urls]
Homepage = "https://github.com/mcderminho/relationl"
Repository = "https://github.com/mcderminho/relationl"
Issues = "https://github.com/mcderminho/relationl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/relationl"]

[tool.hatch.build.targets.sdist]
include = [
    "src/relationl",
    "tests",
    "assets",
    "README.md",
    "LICENSE",
    "relationl.example.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# tests/fixtures is sample code for the scanner to read, not code that runs.
# It deliberately contains undefined names (`spark`) and PySpark's `== True`,
# which is required Column semantics rather than a truth check.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP031: percent-formatting is used consistently throughout this package.
ignore = ["E501", "UP031"]
